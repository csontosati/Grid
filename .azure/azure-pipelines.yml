trigger:
  - main
  - master

pool:
  # Back to Linux! It's faster and we don't need Windows for the backend
  vmImage: 'ubuntu-latest' 

variables:
  buildConfiguration: 'Release'

steps:
- task: UseDotNet@2
  displayName: 'Install .NET SDK'
  inputs:
    packageType: 'sdk'
    version: '10.x'

# 1. Build ONLY the Test projects (This auto-builds DAL and BL, but skips App)
- task: DotNetCoreCLI@2
  displayName: 'Build Backend & Tests'
  inputs:
    command: 'build'
    projects: '**/*Tests.csproj' 
    arguments: '--configuration $(buildConfiguration)'

- task: DotNetCoreCLI@2
  displayName: 'Run Unit and Integration Tests'
  inputs:
    command: 'test'
    projects: |
      **/*Tests.csproj
      !**/*Common.Tests.csproj
    arguments: '--configuration $(buildConfiguration) --logger trx --no-build'