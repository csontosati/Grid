trigger:
  - main
  - master

pool:
  # FIX 1: Change ubuntu-latest to windows-latest. 
  # Windows servers handle MAUI UI projects much better.
  vmImage: 'windows-latest' 

variables:
  buildConfiguration: 'Release'

steps:
# Step 1: Tell the server to use .NET 10
- task: UseDotNet@2
  displayName: 'Install .NET SDK'
  inputs:
    packageType: 'sdk'
    version: '10.x'

# FIX 2: ADD THIS NEW STEP
# This downloads the Android/MAUI tools your App project needs
- script: dotnet workload restore
  displayName: 'Install MAUI Workloads'

# Step 3: Build the entire solution (.slnx)
- task: DotNetCoreCLI@2
  displayName: 'Build the Solution'
  inputs:
    command: 'build'
    projects: '**/*.slnx'
    arguments: '--configuration $(buildConfiguration)'

# Step 4: Find and run the xUnit tests
- task: DotNetCoreCLI@2
  displayName: 'Run Unit and Integration Tests'
  inputs:
    command: 'test'
    projects: '**/*Tests.csproj'
    arguments: '--configuration $(buildConfiguration) --logger trx'