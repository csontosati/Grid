name: CI

on:
  push:
    branches: [ main ]
    branches: [main]
  pull_request:
    branches: [ main ]
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  buildConfiguration: Release

jobs:
  build-and-test:
  # ──────────────────────────────────────────────────────────
  # Job 1: Build + run DAL & BL xUnit tests inside Docker.
  # The tests run as part of the image build (RUN dotnet test),
  # so the job fails immediately if any test fails.
  # ──────────────────────────────────────────────────────────
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image (runs xUnit tests inside)
        uses: docker/build-push-action@v6
        with:
          dotnet-version: '10.x'
          context: .
          target: test
          push: false
          # Layer cache shared across runs via GitHub Actions cache
          cache-from: type=gha,scope=test
          cache-to: type=gha,mode=max,scope=test

      # Build only the test projects (pulls in DAL/BL as dependencies automatically,
      # skips GameLib.App since that needs MAUI workloads we don't want on free CI runners)
      - name: Build backend & tests
        run: |
          dotnet build solution/GameLib.Tests/GameLib.DAL.Tests.csproj --configuration $buildConfiguration
          dotnet build solution/GameLib.BL.Tests/GameLib.BL.Tests.csproj --configuration $buildConfiguration
  # ──────────────────────────────────────────────────────────
  # Job 2: Compile the MAUI Android APK on Linux.
  # On Linux, only net10.0-android is targeted (iOS/Windows
  # targets are conditionally excluded in GameLib.App.csproj).
  # This is a headless compile-validation — no emulator needed.
  # ──────────────────────────────────────────────────────────
  android-build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GameLib.Common.Tests is shared seed/assert data referenced by the two suites
      # above (built transitively) - it has no tests of its own, so it's not run here.
      - name: Run DAL tests
        run: dotnet test solution/GameLib.Tests/GameLib.DAL.Tests.csproj --configuration $buildConfiguration --logger trx --no-build
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run BL tests
        run: dotnet test solution/GameLib.BL.Tests/GameLib.BL.Tests.csproj --configuration $buildConfiguration --logger trx --no-build
      - name: Build Android APK image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: apk-export
          push: false
          # Export only the APK from the scratch stage — avoids copying
          # the entire container filesystem as an artifact.
          outputs: type=local,dest=./apk-output
          cache-from: type=gha,scope=android
          cache-to: type=gha,mode=max,scope=android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gamelib-android-debug
          path: apk-output/apk/*.apk
          if-no-files-found: warn
          retention-days: 7